components:
  schemas:
    DigestDigest:
      type: object
      required:
        - id
        - name
        - periodicity
        - state
        - company_id
        - metadata
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        periodicity:
          type: string
        next_run_date:
          nullable: true
          type: string
          format: date
        state:
          type: string
        company_id:
          type: string
          format: uuid
        metadata:
          type: object

    DigestDigestBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DigestDigest'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateDigestDigestRequest:
      type: object
      required:
        - name
        - periodicity
        - state
        - company_id
        - metadata
      properties:
        name:
          type: string
          maxLength: 255
        periodicity:
          type: string
        next_run_date:
          nullable: true
          type: string
          format: date
        state:
          type: string
        company_id:
          type: string
          format: uuid
        metadata:
          type: object

    UpdateDigestDigestRequest:
      type: object
      required:
        - name
        - periodicity
        - state
        - company_id
        - metadata
      properties:
        name:
          type: string
          maxLength: 255
        periodicity:
          type: string
        next_run_date:
          nullable: true
          type: string
          format: date
        state:
          type: string
        company_id:
          type: string
          format: uuid
        metadata:
          type: object

    PatchDigestDigestRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        periodicity:
          type: string
        next_run_date:
          nullable: true
          type: string
          format: date
        state:
          type: string
        company_id:
          type: string
          format: uuid
        metadata:
          type: object

    DigestDigestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DigestDigest'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DigestSubscription:
      type: object
      required:
        - id
        - digest_id
        - user_id
        - state
        - metadata
      properties:
        id:
          type: string
          format: uuid
        digest_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        state:
          type: string
        unsubscribed_at:
          nullable: true
          type: string
          format: date-time
        metadata:
          type: object

    DigestSubscriptionBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DigestSubscription'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
