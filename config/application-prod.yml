server:
  host: 0.0.0.0
  port: ${SERVER_PORT:3000}
  grpc_port: ${GRPC_PORT:50051}
database:
  url: postgresql://root:password@localhost:5432/survey_prod
  max_connections: 20
  min_connections: ${DB_MIN_CONNECTIONS:10}
logging:
  level: info
  format: json
tracing:
  enabled: true
  exporter: otlp
  endpoint: ${OTLP_ENDPOINT:http://localhost:4317}
metrics:
  enabled: true
